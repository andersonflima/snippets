# Deploy do frontend (console Angular + nginx) — padrão pdi-portal, imagem ECR.
# A IMAGEM é construída/publicada (ECR) por uma esteira; este manifesto é aplicado
# no EKS por outra (GitOps), que atualiza a tag da imagem. Substitua <ACCOUNT_ID>.
#
# O nginx serve o SPA e faz proxy de /bff/* para o BFF (BFF_UPSTREAM). Ajuste o
# host conforme o Service do BFF no cluster (namespace/porta).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: microservicos
data:
  BFF_UPSTREAM: http://bff.microservicos.svc.cluster.local:8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservicos
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: <ACCOUNT_ID>.dkr.ecr.sa-east-1.amazonaws.com/microservicos-frontend:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: microservicos
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
