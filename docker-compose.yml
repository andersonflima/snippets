# Stack LOCAL do console de ações (frontend + BFF + microserviços + gateway local).
#
# Topologia:
#   frontend (nginx:80) --/bff/*--> bff (8081) --/<service>/execute--> api-gateway
#   (nginx local, 8080) --por prefixo--> microserviço FastAPI <service> (8080).
#
# O api-gateway substitui, para desenvolvimento, o AWS API Gateway -> VPC Link ->
# NLB -> EKS. Ações que chamam AWS de verdade exigem credenciais/Cognito (M2M) e
# não completam localmente; healthz/login/UI sobem e ficam saudáveis sem AWS.

x-micro: &micro
  restart: unless-stopped
  networks: [actions]
  environment:
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Para exercitar /execute contra AWS real, descomente e use um perfil válido:
  # volumes:
  #   - ${HOME}/.aws:/home/appuser/.aws:ro

# Build args compartilhados pelos serviços Python. PIP_TRUSTED_HOST desliga a
# verificação TLS do pip no build (rede corporativa com CA interna). Vazio por
# padrão = SSL ligado. Ative via env ou .env: PIP_TRUSTED_HOST="pypi.org files.pythonhosted.org".
x-pip-args: &pip-args
  PIP_TRUSTED_HOST: "${PIP_TRUSTED_HOST:-}"

services:
  # ---- microserviços action-driven (FastAPI, :8080, servem /<service>/execute) ----
  create:      { <<: *micro, build: { context: ./microservicos/create, args: *pip-args, secrets: [pip_conf] } }
  destroy:     { <<: *micro, build: { context: ./microservicos/destroy, args: *pip-args, secrets: [pip_conf] } }
  modify:      { <<: *micro, build: { context: ./microservicos/modify, args: *pip-args, secrets: [pip_conf] } }
  start-stop:  { <<: *micro, build: { context: ./microservicos/start-stop, args: *pip-args, secrets: [pip_conf] } }
  storage:     { <<: *micro, build: { context: ./microservicos/storage, args: *pip-args, secrets: [pip_conf] } }
  replicate:   { <<: *micro, build: { context: ./microservicos/replicate, args: *pip-args, secrets: [pip_conf] } }
  restore:     { <<: *micro, build: { context: ./microservicos/restore, args: *pip-args, secrets: [pip_conf] } }
  db-password: { <<: *micro, build: { context: ./microservicos/db-password, args: *pip-args, secrets: [pip_conf] } }
  vpc-link:    { <<: *micro, build: { context: ./microservicos/vpc-link, args: *pip-args, secrets: [pip_conf] } }
  kms:         { <<: *micro, build: { context: ./microservicos/kms, args: *pip-args, secrets: [pip_conf] } }
  finops:      { <<: *micro, build: { context: ./microservicos/finops, args: *pip-args, secrets: [pip_conf] } }
  servicenow:  { <<: *micro, build: { context: ./microservicos/servicenow, args: *pip-args, secrets: [pip_conf] } }
  rds-data:    { <<: *micro, build: { context: ./microservicos/rds-data, args: *pip-args, secrets: [pip_conf] } }

  # ---- insights: analytics/metadata/métricas/logs por produto (mock por padrão) ----
  insights:
    build:
      context: ./microservicos/insights
      args: *pip-args
      secrets: [pip_conf]
    restart: unless-stopped
    networks: [actions]
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-sa-east-1}
      INSIGHTS_MODE: ${INSIGHTS_MODE:-mock}   # mock | aws (aws exige credencial/role)

  # ---- API Gateway local (roteia /<service>/execute por prefixo) ----
  # Config nginx baked na imagem (deploy/local/Dockerfile) — não depende de bind
  # mount do host, que não existe na máquina do serviço.
  api-gateway:
    build: ./deploy/local
    restart: unless-stopped
    networks: [actions]
    depends_on:
      [create, destroy, modify, start-stop, storage, replicate, restore,
       db-password, vpc-link, kms, finops, servicenow, rds-data, insights]

  # ---- BFF (FastAPI, :8081) ----
  bff:
    build:
      context: ./bff
      args: *pip-args
      secrets: [pip_conf]
    restart: unless-stopped
    networks: [actions]
    env_file: [.env]                      # BFF_JWT_SECRET/BFF_USERS sem interpolação ($ do bcrypt)
    environment:
      BFF_COOKIE_SECURE: "false"          # local é HTTP; cookie sem flag Secure
      BFF_COOKIE_SAMESITE: "lax"
      API_GATEWAY_BASE_URL: http://api-gateway:8080
      # Sem Cognito no local: BFF_M2M_ENABLED=false (no .env) faz o BFF encaminhar
      # ao gateway sem token M2M, só com a identidade do ator.
    depends_on: [api-gateway]

  # ---- Frontend (Angular buildado, servido por nginx :80) ----
  frontend:
    build:
      context: ./frontend
      # NPM_STRICT_SSL=false no ambiente (ou .env) desliga a verificação TLS do
      # npm no build — necessário em rede corporativa com CA interna. Default true.
      args:
        NPM_CONFIG_STRICT_SSL: "${NPM_STRICT_SSL:-true}"
    restart: unless-stopped
    networks: [actions]
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    environment:
      BFF_UPSTREAM: http://bff:8081
    depends_on: [bff]

networks:
  actions:
    driver: bridge

# pip.conf montado como secret no build dos serviços Python (index-url do
# Artifactory). Fica disponível só durante o pip install, não é baked na imagem.
# Local usa o placeholder; na máquina corporativa aponte para o seu pip.conf real:
#   PIP_CONF="$HOME/.config/pip/pip.conf" docker compose build
secrets:
  pip_conf:
    file: "${PIP_CONF:-./deploy/pip.conf.example}"
