openapi: 3.0.3
info:
  title: modify — contrato (API Gateway path)
  version: 1.0.0
  description: "Modify genérico — inclui instance class e engine version. Exposto via API Gateway -> VPC Link -> NLB interno -> EKS."
servers:
  - url: "https://${stageVariables.apiDomain}/${stageVariables.basePath}"
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
paths:
  /modify:
    post:
      summary: Modify genérico — inclui instance class e engine version.
      operationId: modify_execute
      tags:
        - modify
      security:
        - CognitoJWT: []
      x-amazon-apigateway-request-validator: all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyRequest"
      responses:
        202:
          description: Ação aceita (assíncrona).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionAccepted"
        400:
          description: Requisição inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: AssumeRole negado / sem permissão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: Conflito / estado inválido do recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        422:
          description: Payload inválido (validação do schema).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        502:
          description: Falha no upstream (EKS/NLB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        connectionType: VPC_LINK
        connectionId: "${stageVariables.vpcLinkId}"
        uri: "http://${stageVariables.nlbDns}/modify/execute"
        passthroughBehavior: when_no_match
        timeoutInMillis: 29000
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
        responses:
          default:
            statusCode: 200
components:
  securitySchemes:
    CognitoJWT:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - "${COGNITO_USER_POOL_ARN}"
  schemas:
    ModifyRequest:
      type: object
      additionalProperties: false
      required:
        - account
        - resource
        - roleArn
        - region
        - environment
        - params
      properties:
        account:
          type: string
          description: Conta AWS alvo (12 dígitos).
          pattern: "^\\d{12}$"
        resource:
          type: string
          description: Nome ou ARN do recurso alvo da ação.
        roleArn:
          type: string
          description: "Role para STS:AssumeRole na conta alvo."
          pattern: "^arn:aws:iam::\\d{12}:role/.+$"
        region:
          type: string
          description: Região AWS.
          pattern: "^[a-z]{2}-[a-z]+-\\d$"
        environment:
          type: string
          enum:
            - dev
            - homol
            - staging
            - prod
          description: "Ambiente target da ação. 'prod' exige GMUD aprovada (ServiceNow)."
        changeNumber:
          type: string
          description: Número da GMUD/change no ServiceNow (obrigatório p/ produção).
        requestId:
          type: string
          description: Idempotency key opcional (correlação do pipeline).
        dryRun:
          type: boolean
          default: false
          description: Valida sem executar.
        params:
          type: object
          description: Parâmetros específicos da ação modify.
          properties:
            resourceType:
              type: string
              enum:
                - db-instance
                - db-cluster
                - ec2-instance
            modifications:
              type: object
              description: Campos a modificar (contrato por tipo de recurso).
              properties:
                dbInstanceClass:
                  type: string
                  description: Nova instance class.
                engineVersion:
                  type: string
                  description: Nova engine version.
                parameterGroupName:
                  type: string
                  description: Parameter group.
                backupRetentionPeriod:
                  type: integer
            applyImmediately:
              type: boolean
              default: false
          required:
            - resourceType
            - modifications
          additionalProperties: false
    ActionAccepted:
      type: object
      required:
        - operationId
        - status
      properties:
        operationId:
          type: string
          description: ID da operação assíncrona.
        status:
          type: string
          enum:
            - accepted
            - in-progress
        resource:
          type: string
          description: Recurso alvo.
        account:
          type: string
          description: Conta alvo.
        links:
          type: object
          properties:
            status:
              type: string
              description: URL de consulta de status.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
            - assume_role_denied
            - not_found
            - conflict
            - upstream_error
        message:
          type: string
          description: Descrição do erro.
        requestId:
          type: string
          description: Correlação.
