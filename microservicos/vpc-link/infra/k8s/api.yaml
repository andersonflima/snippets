# Deploy do microserviço vpc-link (padrão pdi-portal, imagem ECR sa-east-1).
# Substitua <ACCOUNT_ID> pela conta da plataforma (a esteira de deploy sobrescreve
# a tag da imagem). Defina RULES_BACKEND (s3|dynamodb) e as chaves no ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpc-link
  namespace: microservicos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/microservicos-vpc-link-irsa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpc-link-config
  namespace: microservicos
data:
  AWS_REGION: sa-east-1
  RULES_REGION: sa-east-1
  RULES_CACHE_TTL: "60"
  RULES_BACKEND: dynamodb
  RULES_TABLE: microservicos-rules
  RULES_PK: service
  RULES_ATTR: rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpc-link
  namespace: microservicos
  labels:
    app: vpc-link
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vpc-link
  template:
    metadata:
      labels:
        app: vpc-link
    spec:
      serviceAccountName: vpc-link
      containers:
        - name: vpc-link
          image: <ACCOUNT_ID>.dkr.ecr.sa-east-1.amazonaws.com/microservicos-vpc-link:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vpc-link-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: vpc-link
  namespace: microservicos
spec:
  selector:
    app: vpc-link
  ports:
    - port: 8080
      targetPort: 8080
