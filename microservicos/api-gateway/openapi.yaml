            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        202:
          description: Ação aceita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
        400:
          description: Requisição inválida / operação não suportada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: AssumeRole negado / rule_violation / GMUD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
