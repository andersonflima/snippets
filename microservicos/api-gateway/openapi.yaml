components:
  securitySchemes:
    CognitoJWT:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
        - ${COGNITO_USER_POOL_ARN}
  schemas:
    CreateRequest:
      type: object
      additionalProperties: false
      required:
      - account
      - roleArn
      - region
      - environment
      - params
      properties:
        account:
          type: string
          description: Conta AWS alvo (12 dígitos).
          pattern: ^\d{12}$
        resource:
          type: string
          default: '*'
          description: Recurso alvo (nome/ARN) ou '*' para operações de conta.
        roleArn:
          type: string
          description: Role para STS:AssumeRole.
          pattern: ^arn:aws:iam::\d{12}:role/.+$
        region:
          type: string
          description: Região AWS.
          pattern: ^[a-z]{2}-[a-z]+-\d$
        environment:
          type: string
          enum:
          - dev
          - homol
          - staging
          - prod
          description: Ambiente target (regras segregam por ambiente).
        changeNumber:
          type: string
          description: Número da GMUD (exigido p/ mutações em produção, salvo exceção).
        requestId:
          type: string
          description: Idempotency key opcional.
        dryRun:
          type: boolean
          default: false
          description: Valida contra as regras e resolve a operação sem chamar a AWS.
        params:
          type: object
          additionalProperties: false
          required:
          - operation
          properties:
            operation:
              type: string
              description: Operação a executar, formato "<client>:<Op>".
              enum:
              - dynamodb:CreateBackup
              - dynamodb:CreateGlobalTable
              - dynamodb:CreateTable
              - elasticache:CreateCacheCluster
              - elasticache:CreateCacheParameterGroup
              - elasticache:CreateCacheSecurityGroup
              - elasticache:CreateCacheSubnetGroup
              - elasticache:CreateGlobalReplicationGroup
              - elasticache:CreateReplicationGroup
              - elasticache:CreateServerlessCache
              - elasticache:CreateServerlessCacheSnapshot
              - elasticache:CreateSnapshot
              - elasticache:CreateUser
              - elasticache:CreateUserGroup
              - elasticache:PurchaseReservedCacheNodesOffering
              - rds:CreateBlueGreenDeployment
              - rds:CreateCustomDBEngineVersion
              - rds:CreateDBCluster
              - rds:CreateDBClusterEndpoint
              - rds:CreateDBClusterParameterGroup
              - rds:CreateDBClusterSnapshot
              - rds:CreateDBInstance
              - rds:CreateDBInstanceReadReplica
              - rds:CreateDBParameterGroup
              - rds:CreateDBProxy
              - rds:CreateDBProxyEndpoint
              - rds:CreateDBSecurityGroup
              - rds:CreateDBShardGroup
              - rds:CreateDBSnapshot
              - rds:CreateDBSubnetGroup
              - rds:CreateEventSubscription
              - rds:CreateGlobalCluster
              - rds:CreateIntegration
              - rds:CreateOptionGroup
              - rds:CreateTenantDatabase
              - rds:PurchaseReservedDBInstancesOffering
              - rds:RegisterDBProxyTargets
            args:
              type: object
              description: Kwargs da operação boto3 (formato low-level), verbatim.
    ActionAccepted:
      type: object
      required:
      - operationId
      - status
      properties:
        operationId:
          type: string
          description: ID da operação assíncrona.
        status:
          type: string
          enum:
          - accepted
          - in-progress
        resource:
          type: string
          description: Recurso alvo.
        account:
          type: string
          description: Conta alvo.
        links:
          type: object
          properties:
            status:
              type: string
              description: URL de consulta de status.
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - validation_error
          - assume_role_denied
          - not_found
          - conflict
          - upstream_error
        message:
          type: string
          description: Descrição do erro.
        requestId:
          type: string
          description: Correlação.
    DataRequest:
      type: object
      additionalProperties: false
      required:
      - account
      - roleArn
      - region
      - environment
      - params
      properties:
        account:
          type: string
          description: Conta AWS alvo (12 dígitos).
          pattern: ^\d{12}$
        resource:
          type: string
          default: '*'
          description: Recurso alvo (nome/ARN) ou '*' para operações de conta.
        roleArn:
