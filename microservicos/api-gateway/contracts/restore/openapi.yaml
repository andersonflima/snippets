# Gerado por gen_gateway.py — contrato API Gateway segregado por microserviço.
openapi: 3.0.3
info:
  title: restore — contrato (API Gateway path)
  version: 1.0.0
  description: 'Restore/copy/backtrack/export/import de recursos. O que pode / não pode é decidido por
    regras externas segregadas por ambiente, com exceções por conta + recurso. Exposto via API Gateway
    -> VPC Link -> NLB interno -> EKS. `params.operation` no formato "<client>:<Op>".

    '
servers:
- url: https://${stageVariables.apiDomain}/${stageVariables.basePath}
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
paths:
  /restore:
    post:
      summary: Executa uma operação (governada por regras externas).
      operationId: restore_execute
      tags:
      - restore
      security:
      - CognitoJWT: []
      x-amazon-apigateway-request-validator: all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        202:
          description: Ação aceita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAccepted'
        400:
          description: Requisição inválida / operação não suportada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        403:
          description: AssumeRole negado / rule_violation / GMUD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Conflito / estado inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          description: Payload inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Erro interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        502:
          description: Falha no upstream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        connectionType: VPC_LINK
        connectionId: ${stageVariables.vpcLinkId}
        uri: http://${stageVariables.nlbDns}/restore/execute
        passthroughBehavior: when_no_match
        timeoutInMillis: 29000
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
        responses:
          default:
            statusCode: 200
components:
  securitySchemes:
    CognitoJWT:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
        - ${COGNITO_USER_POOL_ARN}
  schemas:
    RestoreRequest:
      type: object
      additionalProperties: false
      required:
      - account
      - roleArn
      - region
      - environment
      - params
      properties:
        account:
          type: string
          description: Conta AWS alvo (12 dígitos).
          pattern: ^\d{12}$
        resource:
          type: string
          default: '*'
          description: Recurso alvo (nome/ARN) ou '*' para operações de conta.
        roleArn:
          type: string
          description: Role para STS:AssumeRole.
          pattern: ^arn:aws:iam::\d{12}:role/.+$
        region:
          type: string
          description: Região AWS.
          pattern: ^[a-z]{2}-[a-z]+-\d$
        environment:
          type: string
          enum:
          - dev
          - homol
          - staging
          - prod
          description: Ambiente target (regras segregam por ambiente).
        changeNumber:
          type: string
          description: Número da GMUD (exigido p/ mutações em produção, salvo exceção).
        requestId:
          type: string
          description: Idempotency key opcional.
        dryRun:
          type: boolean
          default: false
          description: Valida contra as regras e resolve a operação sem chamar a AWS.
        params:
          type: object
          additionalProperties: false
          required:
          - operation
          properties:
            operation:
              type: string
              description: Operação a executar, formato "<client>:<Op>".
              enum:
              - dynamodb:ExportTableToPointInTime
              - dynamodb:ImportTable
              - dynamodb:RestoreTableFromBackup
              - dynamodb:RestoreTableToPointInTime
              - elasticache:CopyServerlessCacheSnapshot
              - elasticache:CopySnapshot
              - elasticache:ExportServerlessCacheSnapshot
              - rds:BacktrackDBCluster
              - rds:CancelExportTask
              - rds:CopyDBClusterParameterGroup
              - rds:CopyDBClusterSnapshot
              - rds:CopyDBParameterGroup
              - rds:CopyDBSnapshot
              - rds:CopyOptionGroup
              - rds:RestoreDBClusterFromS3
              - rds:RestoreDBClusterFromSnapshot
              - rds:RestoreDBClusterToPointInTime
              - rds:RestoreDBInstanceFromDBSnapshot
              - rds:RestoreDBInstanceFromS3
              - rds:RestoreDBInstanceToPointInTime
            args:
              type: object
              description: Kwargs da operação boto3 (formato low-level), verbatim.
    ActionAccepted:
      type: object
      required:
      - operationId
      - status
      properties:
        operationId:
          type: string
        status:
          type: string
          enum:
          - accepted
          - in-progress
        resource:
          type: string
        account:
          type: string
        detail:
          type: object
          description: Resultado (ou plano
          em dryRun).: null
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - validation_error
          - rule_violation
          - gmud_required
          - assume_role_denied
          - not_found
          - conflict
          - upstream_error
          - internal_error
        message:
          type: string
        requestId:
          type: string
