openapi: 3.0.3
info:
  title: dynamodb — contrato (API Gateway path)
  version: 1.0.0
  description: >
    Operações DynamoDB (control plane + data plane) numa única ação. O que pode /
    não pode é decidido por regras externas segregadas por ambiente, com exceções
    por conta + recurso. Exposto via API Gateway -> VPC Link -> NLB interno -> EKS.
servers:
  - url: "https://${stageVariables.apiDomain}/${stageVariables.basePath}"
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
paths:
  /dynamodb:
    post:
      summary: Executa uma operação DynamoDB (governada por regras externas).
      operationId: dynamodb_execute
      tags:
        - dynamodb
      security:
        - CognitoJWT: []
      x-amazon-apigateway-request-validator: all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamoRequest"
      responses:
        202:
          description: Ação aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionAccepted"
        400:
          description: Requisição inválida / operação não suportada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: AssumeRole negado / regra de negócio (rule_violation) / GMUD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: Conflito / estado inválido do recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        422:
          description: Payload inválido (validação do schema).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        502:
          description: Falha no upstream (EKS/NLB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        connectionType: VPC_LINK
        connectionId: "${stageVariables.vpcLinkId}"
        uri: "http://${stageVariables.nlbDns}/dynamodb/execute"
        passthroughBehavior: when_no_match
        timeoutInMillis: 29000
        requestParameters:
          integration.request.header.X-Request-Id: context.requestId
        responses:
          default:
            statusCode: 200
components:
  securitySchemes:
    CognitoJWT:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - "${COGNITO_USER_POOL_ARN}"
  schemas:
    DynamoRequest:
      type: object
      additionalProperties: false
      required:
        - account
        - resource
        - roleArn
        - region
        - environment
        - params
      properties:
        account:
          type: string
          description: Conta AWS alvo (12 dígitos).
          pattern: "^\\d{12}$"
        resource:
          type: string
          description: "Recurso alvo (tabela/backup/ARN) ou '*' para operações de conta."
        roleArn:
          type: string
          description: "Role para STS:AssumeRole na conta alvo."
          pattern: "^arn:aws:iam::\\d{12}:role/.+$"
        region:
          type: string
          description: Região AWS.
          pattern: "^[a-z]{2}-[a-z]+-\\d$"
        environment:
          type: string
          enum:
            - dev
            - homol
            - staging
            - prod
          description: "Ambiente target. As regras externas segregam o permitido por ambiente."
        changeNumber:
          type: string
          description: "Número da GMUD (exigido para mutações de estrutura em produção, salvo exceção)."
        requestId:
          type: string
          description: Idempotency key opcional.
        dryRun:
          type: boolean
          default: false
          description: Valida contra as regras e resolve a operação sem chamar a AWS.
        params:
          type: object
          additionalProperties: false
          required:
            - operation
          properties:
            operation:
              type: string
              description: Operação DynamoDB a executar.
              enum:
                - GetItem
                - Query
                - Scan
                - BatchGetItem
                - TransactGetItems
                - PutItem
                - UpdateItem
                - DeleteItem
                - BatchWriteItem
                - TransactWriteItems
                - ExecuteStatement
                - BatchExecuteStatement
                - ExecuteTransaction
                - CreateTable
                - DeleteTable
                - UpdateTable
                - DescribeTable
                - ListTables
                - UpdateTimeToLive
                - DescribeTimeToLive
                - CreateGlobalTable
                - UpdateGlobalTable
                - UpdateGlobalTableSettings
                - DescribeGlobalTable
                - DescribeGlobalTableSettings
                - ListGlobalTables
                - DescribeKinesisStreamingDestination
                - EnableKinesisStreamingDestination
                - DisableKinesisStreamingDestination
                - UpdateContinuousBackups
                - DescribeContinuousBackups
                - TagResource
                - UntagResource
                - ListTagsOfResource
                - UpdateContributorInsights
                - DescribeContributorInsights
                - DescribeLimits
                - DescribeEndpoints
                - CreateBackup
                - DeleteBackup
                - DescribeBackup
                - ListBackups
                - RestoreTableFromBackup
                - RestoreTableToPointInTime
                - ExportTableToPointInTime
                - DescribeExport
                - ListExports
                - ImportTable
                - DescribeImport
                - ListImports
            args:
              type: object
              description: "Kwargs da operação boto3 (formato low-level DynamoDB), ex.: TableName, Item, KeySchema, KeyConditionExpression."
    ActionAccepted:
      type: object
      required:
        - operationId
        - status
      properties:
        operationId:
          type: string
        status:
          type: string
          enum:
            - accepted
            - in-progress
        resource:
          type: string
        account:
          type: string
        detail:
          type: object
          description: Resultado da operação (ou plano, em dryRun).
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
            - rule_violation
            - gmud_required
            - assume_role_denied
            - not_found
            - conflict
            - upstream_error
            - internal_error
        message:
          type: string
        requestId:
          type: string
