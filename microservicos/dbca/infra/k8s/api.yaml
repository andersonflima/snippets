# Deploy do microserviço dbca (padrão pdi-portal, imagem ECR sa-east-1).
# Substitua <ACCOUNT_ID> pela conta da plataforma. A IRSA precisa de:
#   sts:AssumeRole (nas roles-alvo microservicos-dbca-target das contas),
#   s3:GetObject no bucket de queries (QUERIES_BUCKET).
# A role-alvo em cada conta precisa: rds:Describe*, rds:ListTagsForResource,
#   dynamodb:DescribeTable, rds-data:ExecuteStatement (read-only), secretsmanager (via Data API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbca
  namespace: microservicos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/microservicos-dbca-irsa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbca-config
  namespace: microservicos
data:
  AWS_REGION: sa-east-1
  DEFAULT_TARGET_REGION: sa-east-1
  TARGET_ROLE_NAME: microservicos-dbca-target
  QUERIES_BUCKET: microservicos-dbca-queries
  QUERIES_KEY: dbca/queries.json
  QUERIES_CACHE_TTL: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbca
  namespace: microservicos
  labels:
    app: dbca
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dbca
  template:
    metadata:
      labels:
        app: dbca
    spec:
      serviceAccountName: dbca
      containers:
        - name: dbca
          image: <ACCOUNT_ID>.dkr.ecr.sa-east-1.amazonaws.com/microservicos-dbca:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dbca-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: dbca
  namespace: microservicos
spec:
  selector:
    app: dbca
  ports:
    - port: 8080
      targetPort: 8080
