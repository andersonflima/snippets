# API Gateway LOCAL (substituto do AWS API Gateway -> VPC Link -> NLB -> EKS).
# O BFF chama POST /<service>/execute nesta porta; cada microserviço serve o path
# completo /<service>/execute, então aqui só roteamos por prefixo, sem reescrever.
# Nomes de serviço = nomes dos containers no compose (rede interna do Docker).

server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;   # DNS interno do Docker

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /create/        { set $u http://create:8080;        proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /destroy/       { set $u http://destroy:8080;       proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /modify/        { set $u http://modify:8080;        proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /start-stop/    { set $u http://start-stop:8080;    proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /storage/       { set $u http://storage:8080;       proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /replicate/     { set $u http://replicate:8080;     proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /restore/       { set $u http://restore:8080;       proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /db-password/   { set $u http://db-password:8080;   proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /vpc-link/      { set $u http://vpc-link:8080;      proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /kms/           { set $u http://kms:8080;           proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /finops/        { set $u http://finops:8080;        proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /servicenow/    { set $u http://servicenow:8080;    proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /rds-data/      { set $u http://rds-data:8080;      proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /dynamodb/      { set $u http://dynamodb:8080;      proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /dbca/          { set $u http://dbca:8080;          proxy_pass $u; include /etc/nginx/proxy_common.conf; }
    location /insights/      { set $u http://insights:8080;      proxy_pass $u; include /etc/nginx/proxy_common.conf; }

    location / { return 404; }
}
